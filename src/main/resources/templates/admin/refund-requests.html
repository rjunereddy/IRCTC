<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Refund Requests - IRCTC Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand" href="/admin/dashboard">
                <i class="fas fa-train"></i> IRCTC Admin
            </a>
            <div class="ms-auto">
                <a href="/auth/logout" class="btn btn-outline-light btn-sm">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row">
            <div class="col-md-3 mb-4">
                <div class="list-group">
                    <a href="/admin/dashboard" class="list-group-item list-group-item-action">
                        <i class="fas fa-tachometer-alt"></i> Dashboard
                    </a>
                    <a href="/admin/trains" class="list-group-item list-group-item-action">
                        <i class="fas fa-train"></i> Manage Trains
                    </a>
                    <a href="/admin/reports" class="list-group-item list-group-item-action">
                        <i class="fas fa-chart-bar"></i> Reports
                    </a>
                    <a href="/admin/refunds" class="list-group-item list-group-item-action active">
                        <i class="fas fa-money-bill-wave"></i> Refund Requests
                    </a>
                    <a href="/admin/users" class="list-group-item list-group-item-action">
                        <i class="fas fa-users"></i> Manage Users
                    </a>
                </div>
            </div>
            <div class="col-md-9">
                <div th:if="${message}" class="alert alert-success">
                    <i class="fas fa-check-circle"></i> <strong th:text="${message}"></strong>
                </div>
                <div th:if="${error}" class="alert alert-danger">
                    <i class="fas fa-exclamation-triangle"></i> <strong th:text="${error}"></strong>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-money-bill-wave"></i> Refund Requests</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${refunds == null or refunds.isEmpty()}">
                            <div class="alert alert-info">
                                <i class="fas fa-info-circle"></i> No refund requests pending.
                            </div>
                        </div>
                        <div th:if="${refunds != null and not refunds.isEmpty()}">
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>PNR</th>
                                            <th>Passenger</th>
                                            <th>Train</th>
                                            <th>Journey Date</th>
                                            <th>Fare</th>
                                            <th>Refund Status</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="ticket : ${refunds}">
                                            <td th:text="${ticket.pnr}"></td>
                                            <td th:text="${ticket.passenger.fullName}"></td>
                                            <td>
                                                <span th:text="${ticket.train.trainName}"></span><br>
                                                <small th:text="${ticket.train.trainNo}"></small>
                                            </td>
                                            <td th:text="${ticket.journeyDate}"></td>
                                            <td>₹ <span th:text="${ticket.totalFare}"></span></td>
                                            <td>
                                                <span class="badge bg-info" th:text="${ticket.refundStatus}"></span>
                                            </td>
                                            <td>
                                                <form method="post" th:action="@{/admin/refunds/approve/{pnr}(pnr=${ticket.pnr})}" style="display:inline; margin-right: 5px;">
                                                    <button type="submit" class="btn btn-success btn-sm">
                                                        <i class="fas fa-check"></i> Approve
                                                    </button>
                                                </form>
                                                <form method="post" th:action="@{/admin/refunds/reject/{pnr}(pnr=${ticket.pnr})}" style="display:inline;">
                                                    <button type="submit" class="btn btn-danger btn-sm">
                                                        <i class="fas fa-times"></i> Reject
                                                    </button>
                                                </form>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
