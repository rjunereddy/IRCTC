<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users & Roles - IRCTC Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --admin-red: #c0392b; }
        body { background: #f4f6f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .bg-admin { background-color: var(--admin-red) !important; }
        .sidebar-link.active { background: var(--admin-red) !important; color: #fff !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-admin shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="/admin/dashboard"><i class="fas fa-train me-2"></i>IRCTC Admin</a>
            <div class="ms-auto">
                <a href="/auth/logout" class="btn btn-outline-light btn-sm rounded-pill"><i class="fas fa-sign-out-alt me-1"></i>Logout</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4 px-4">
        <div class="row">
            <div class="col-md-2 mb-4">
                <div class="list-group shadow-sm" style="font-size:13px">
                    <a href="/admin/dashboard" class="list-group-item list-group-item-action"><i class="fas fa-tachometer-alt me-2"></i>Dashboard</a>
                    <a href="/admin/trains" class="list-group-item list-group-item-action"><i class="fas fa-train me-2"></i>Manage Trains</a>
                    <a href="/admin/stations" class="list-group-item list-group-item-action"><i class="fas fa-map-marker-alt me-2"></i>Stations</a>
                    <a href="/admin/reports" class="list-group-item list-group-item-action"><i class="fas fa-chart-bar me-2"></i>Reports</a>
                    <a href="/admin/users" class="list-group-item list-group-item-action active"><i class="fas fa-users me-2"></i>Users & Roles</a>
                    <a href="/admin/refunds" class="list-group-item list-group-item-action"><i class="fas fa-undo me-2"></i>Refunds</a>
                </div>
            </div>
            <div class="col-md-10">
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle me-2"></i><span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 text-dark fw-bold"><i class="fas fa-users-cog text-danger me-2"></i>User & Role Management</h5>
                        <span class="badge bg-secondary" th:text="${users != null ? users.size() : 0} + ' Registered Users'">0 Users</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0 align-middle">
                                <thead class="table-light" style="font-size:12px; text-transform:uppercase;">
                                    <tr>
                                        <th>ID</th>
                                        <th>Username</th>
                                        <th>Email</th>
                                        <th>Phone</th>
                                        <th>Current Role</th>
                                        <th>Assign New Role</th>
                                        <th>Status</th>
                                        <th>Registered Date</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="user : ${users}">
                                        <td th:text="${user.userId}">1</td>
                                        <td><strong th:text="${user.username}">admin</strong></td>
                                        <td th:text="${user.email}">admin@irctc.com</td>
                                        <td th:text="${user.phone}">9876543210</td>
                                        <td>
                                            <span th:if="${user.role.name() == 'ADMIN'}" class="badge bg-danger">Admin</span>
                                            <span th:if="${user.role.name() == 'TICKET_COLLECTOR'}" class="badge bg-warning text-dark">Ticket Collector (TTE)</span>
                                            <span th:if="${user.role.name() == 'STATION_MASTER'}" class="badge bg-success">Station Master</span>
                                            <span th:if="${user.role.name() == 'PASSENGER'}" class="badge bg-primary">Passenger</span>
                                        </td>
                                        <td>
                                            <form method="post" action="/admin/users/role" class="d-flex gap-1 align-items-center">
                                                <input type="hidden" name="userId" th:value="${user.userId}">
                                                <select name="role" class="form-select form-select-sm" style="width: auto;">
                                                    <option th:each="r : ${T(com.irctc.model.enums.UserRole).values()}"
                                                            th:value="${r.name()}"
                                                            th:text="${r.displayName}"
                                                            th:selected="${user.role == r}">
                                                    </option>
                                                </select>
                                                <button type="submit" class="btn btn-outline-danger btn-sm py-1 px-2" title="Update User Role">
                                                    <i class="fas fa-save"></i>
                                                </button>
                                            </form>
                                        </td>
                                        <td>
                                            <span th:class="${user.active} ? 'badge bg-success' : 'badge bg-secondary'"
                                                  th:text="${user.active} ? 'Active' : 'Inactive'"></span>
                                        </td>
                                        <td th:text="${user.registrationDate != null ? #temporals.format(user.registrationDate, 'dd MMM yyyy') : '-'}"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
