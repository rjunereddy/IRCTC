<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Station Management - IRCTC Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --admin-red: #c0392b; }
        body { background: #f4f6f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .bg-admin { background-color: var(--admin-red) !important; }
        .sidebar-link.active { background: var(--admin-red) !important; color: #fff !important; }
        .junction-badge { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; font-weight: 700; }
        .waystation-badge { background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-admin shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="/admin/dashboard"><i class="fas fa-train me-2"></i>IRCTC Admin - Station Hub</a>
            <div class="ms-auto">
                <a href="/auth/logout" class="btn btn-outline-light btn-sm rounded-pill"><i class="fas fa-sign-out-alt me-1"></i>Logout</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4 px-4">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 mb-4">
                <div class="list-group shadow-sm" style="font-size:13px">
                    <a href="/admin/dashboard" class="list-group-item list-group-item-action"><i class="fas fa-tachometer-alt me-2"></i>Dashboard</a>
                    <a href="/admin/trains" class="list-group-item list-group-item-action"><i class="fas fa-train me-2"></i>Manage Trains</a>
                    <a href="/admin/stations" class="list-group-item list-group-item-action active"><i class="fas fa-map-marker-alt me-2"></i>Stations</a>
                    <a href="/admin/reports" class="list-group-item list-group-item-action"><i class="fas fa-chart-bar me-2"></i>Reports</a>
                    <a href="/admin/users" class="list-group-item list-group-item-action"><i class="fas fa-users me-2"></i>Users & Roles</a>
                    <a href="/admin/refunds" class="list-group-item list-group-item-action"><i class="fas fa-undo me-2"></i>Refunds</a>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-10">
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle me-2"></i><span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Add Station Card -->
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 text-danger fw-bold"><i class="fas fa-plus-circle me-2"></i>Add Railway Station</h5>
                    </div>
                    <div class="card-body p-3">
                        <form method="post" action="/admin/stations/add" class="row g-2 align-items-end">
                            <div class="col-md-2">
                                <label class="form-label small fw-bold">Station Code *</label>
                                <input type="text" name="stationCode" class="form-control form-control-sm" placeholder="e.g. KLBG, HYB" required style="text-transform:uppercase;">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-bold">Station Name *</label>
                                <input type="text" name="stationName" class="form-control form-control-sm" placeholder="e.g. Kalaburagi Junction" required>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label small fw-bold">City *</label>
                                <input type="text" name="city" class="form-control form-control-sm" placeholder="e.g. Gulbarga" required>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label small fw-bold">State *</label>
                                <input type="text" name="state" class="form-control form-control-sm" placeholder="e.g. Karnataka" required>
                            </div>
                            <div class="col-md-1">
                                <label class="form-label small fw-bold">Platforms</label>
                                <input type="number" name="platformCount" class="form-control form-control-sm" value="4" min="1" max="30">
                            </div>
                            <div class="col-md-1 d-flex align-items-center mb-1">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="isJunction" id="isJuncCheck" value="true">
                                    <label class="form-check-label small fw-bold" for="isJuncCheck">Junction</label>
                                </div>
                            </div>
                            <div class="col-md-1">
                                <button type="submit" class="btn btn-danger btn-sm w-100 fw-bold">
                                    <i class="fas fa-plus me-1"></i>Add
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Stations List Table -->
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                        <div>
                            <h5 class="mb-0 text-dark fw-bold"><i class="fas fa-map-marker-alt text-danger me-2"></i>All Stations Across Network
                                <span class="badge bg-secondary ms-2" th:text="${stations != null ? stations.size() : 0}">0</span>
                            </h5>
                        </div>
                        <form method="get" action="/admin/stations" class="d-flex" style="max-width:300px;">
                            <input type="text" name="q" class="form-control form-control-sm me-2" placeholder="Search code or name..." th:value="${query}">
                            <button type="submit" class="btn btn-outline-danger btn-sm"><i class="fas fa-search"></i></button>
                        </form>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive" style="max-height: 550px; overflow-y:auto;">
                            <table class="table table-hover mb-0 align-middle">
                                <thead class="table-light sticky-top" style="font-size:12px; text-transform:uppercase;">
                                    <tr>
                                        <th>Code</th>
                                        <th>Station Name</th>
                                        <th>City</th>
                                        <th>State</th>
                                        <th>Platforms</th>
                                        <th>Category</th>
                                        <th>Default Halt</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="st : ${stations}">
                                        <td><span class="badge bg-dark fw-bold" th:text="${st.stationCode}">KLBG</span></td>
                                        <td class="fw-bold" th:text="${st.stationName}">Kalaburagi</td>
                                        <td th:text="${st.city}">Gulbarga</td>
                                        <td th:text="${st.state}">Karnataka</td>
                                        <td>
                                            <span class="badge bg-light text-dark border" th:text="${st.platformCount != null ? st.platformCount : 2} + ' Platforms'">2 Platforms</span>
                                        </td>
                                        <td>
                                            <span th:if="${st.isMajorStation()}" class="badge junction-badge"><i class="fas fa-code-branch me-1"></i>Major Junction</span>
                                            <span th:unless="${st.isMajorStation()}" class="badge waystation-badge">Way Station</span>
                                        </td>
                                        <td>
                                            <span class="badge bg-warning text-dark" th:text="${st.getDefaultHaltMinutes()} + ' mins'">10 mins</span>
                                        </td>
                                        <td>
                                            <form method="post" th:action="@{/admin/stations/delete/{code}(code=${st.stationCode})}"
                                                  onsubmit="return confirm('Delete station ' + this.dataset.code + '?')"
                                                  th:data-code="${st.stationCode}" style="display:inline;">
                                                <button type="submit" class="btn btn-outline-danger btn-sm py-0 px-2" title="Delete Station">
                                                    <i class="fas fa-trash-alt"></i>
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
