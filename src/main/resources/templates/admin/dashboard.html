<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - IRCTC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-train"></i> IRCTC Admin
            </a>
            <div class="ms-auto">
                <span class="text-white me-3">Welcome, Admin</span>
                <a href="/auth/logout" class="btn btn-outline-light btn-sm">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row">
            <div class="col-md-3 mb-4">
                <div class="list-group">
                    <a href="/admin/dashboard" class="list-group-item list-group-item-action active">
                        <i class="fas fa-tachometer-alt"></i> Dashboard
                    </a>
                    <a href="/admin/trains" class="list-group-item list-group-item-action">
                        <i class="fas fa-train"></i> Manage Trains
                    </a>
                    <a href="/admin/stations" class="list-group-item list-group-item-action">
                        <i class="fas fa-map-marker-alt"></i> Stations Hub
                    </a>
                    <a href="/admin/reports" class="list-group-item list-group-item-action">
                        <i class="fas fa-chart-bar"></i> Reports
                    </a>
                    <a href="/admin/refunds" class="list-group-item list-group-item-action">
                        <i class="fas fa-money-bill-wave"></i> Refund Requests
                    </a>
                    <a href="/admin/users" class="list-group-item list-group-item-action">
                        <i class="fas fa-users"></i> Manage Users
                    </a>
                </div>
            </div>
            <div class="col-md-9">
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <div class="card text-white bg-primary">
                            <div class="card-body">
                                <h5><i class="fas fa-train"></i> Total Trains</h5>
                                <h2 th:text="${trains.size()}">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 mb-4">
                        <div class="card text-white bg-success">
                            <div class="card-body">
                                <h5><i class="fas fa-users"></i> Total Users</h5>
                                <h2>--</h2>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-train"></i> Recent Trains</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Train No</th>
                                        <th>Train Name</th>
                                        <th>From</th>
                                        <th>To</th>
                                        <th>Seats</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="train : ${trains}">
                                        <td th:text="${train.trainNo}"></td>
                                        <td th:text="${train.trainName}"></td>
                                        <td th:text="${train.sourceStation.stationCode}"></td>
                                        <td th:text="${train.destinationStation.stationCode}"></td>
                                        <td th:text="${train.availableSeats} + '/' + ${train.totalSeats}"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
