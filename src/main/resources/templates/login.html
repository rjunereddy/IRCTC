<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - IRCTC Indian Railways</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px 0;
        }
        .login-card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            overflow: hidden;
        }
        .login-header {
            background: #d32f2f;
            color: white;
            text-align: center;
            padding: 24px 20px;
        }
        .btn-login {
            background: #d32f2f;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .btn-login:hover {
            background: #b71c1c;
            color: white;
            transform: translateY(-1px);
        }
        .demo-card {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .demo-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h3 class="fw-bold mb-1"><i class="fas fa-train me-2"></i>IRCTC e-Ticketing</h3>
            <p class="mb-0 small text-white-50">Indian Railway Catering & Tourism Corporation</p>
        </div>
        <div class="p-4">
            <!-- Error message -->
            <div th:if="${param.error}" class="alert alert-danger py-2" style="font-size: 13px;">
                <i class="fas fa-exclamation-circle me-1"></i> Invalid username or password.
            </div>
            <!-- Logout message -->
            <div th:if="${param.logout}" class="alert alert-info py-2" style="font-size: 13px;">
                <i class="fas fa-check-circle me-1"></i> Logged out successfully.
            </div>
            <!-- Registration message -->
            <div th:if="${message}" class="alert alert-success py-2" style="font-size: 13px;">
                <i class="fas fa-check-circle me-1"></i> <span th:text="${message}"></span>
            </div>

            <form th:action="@{/auth/do-login}" method="post">
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">USERNAME</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fas fa-user text-muted"></i></span>
                        <input type="text" name="username" id="username" class="form-control" placeholder="Enter username" required autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">PASSWORD</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" name="password" id="password" class="form-control" placeholder="Enter password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-login w-100 shadow-sm mt-2">
                    <i class="fas fa-sign-in-alt me-2"></i>Sign In
                </button>
            </form>

            <div class="text-center mt-3">
                <span class="text-muted small">New User? </span>
                <a th:href="@{/auth/register}" class="text-decoration-none fw-bold small text-danger">Register Now</a>
            </div>

            <hr class="my-4">

            <!-- QUICK DEMO LOGINS -->
            <div>
                <h6 class="text-muted text-center mb-3" style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px;">
                    <i class="fas fa-bolt text-warning me-1"></i> Quick Demo Logins (Click to autofill)
                </h6>
                <div class="row g-2">
                    <div class="col-6">
                        <button type="button" class="btn btn-outline-primary w-100 btn-sm text-start demo-card p-2" onclick="fillCreds('traveler', 'user123')">
                            <div class="fw-bold"><i class="fas fa-user me-1"></i>Passenger</div>
                            <div class="text-muted" style="font-size:11px">traveler / user123</div>
                        </button>
                    </div>
                    <div class="col-6">
                        <button type="button" class="btn btn-outline-danger w-100 btn-sm text-start demo-card p-2" onclick="fillCreds('admin', 'admin123')">
                            <div class="fw-bold"><i class="fas fa-shield-alt me-1"></i>Admin</div>
                            <div class="text-muted" style="font-size:11px">admin / admin123</div>
                        </button>
                    </div>
                    <div class="col-6">
                        <button type="button" class="btn btn-outline-warning w-100 btn-sm text-start demo-card p-2" onclick="fillCreds('tte', 'tte123')">
                            <div class="fw-bold text-dark"><i class="fas fa-id-badge text-warning me-1"></i>TTE (Collector)</div>
                            <div class="text-muted" style="font-size:11px">tte / tte123</div>
                        </button>
                    </div>
                    <div class="col-6">
                        <button type="button" class="btn btn-outline-success w-100 btn-sm text-start demo-card p-2" onclick="fillCreds('stationmaster', 'sm123')">
                            <div class="fw-bold"><i class="fas fa-broadcast-tower me-1"></i>Station Master</div>
                            <div class="text-muted" style="font-size:11px">stationmaster / sm123</div>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function fillCreds(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }
    </script>
</body>
</html>
