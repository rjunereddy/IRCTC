<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Saved Passengers - IRCTC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-train"></i> IRCTC
            </a>
            <div class="ms-auto">
                <a href="/auth/logout" class="btn btn-outline-light btn-sm">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row">
            <div class="col-md-3 mb-4">
                <div class="list-group">
                    <a href="/passenger/dashboard" class="list-group-item list-group-item-action">
                        <i class="fas fa-tachometer-alt"></i> Dashboard
                    </a>
                    <a href="/passenger/search" class="list-group-item list-group-item-action">
                        <i class="fas fa-search"></i> Book Ticket
                    </a>
                    <a href="/passenger/wallet" class="list-group-item list-group-item-action">
                        <i class="fas fa-wallet"></i> My Wallet
                    </a>
                    <a href="/passenger/saved-passengers" class="list-group-item list-group-item-action active">
                        <i class="fas fa-users"></i> Saved Passengers
                    </a>
                    <a href="/passenger/booking-history" class="list-group-item list-group-item-action">
                        <i class="fas fa-history"></i> Booking History
                    </a>
                </div>
            </div>
            <div class="col-md-9">
                <div class="card mb-4">
                    <div class="card-header bg-success text-white">
                        <h5><i class="fas fa-user-plus"></i> Add New Passenger to Master List</h5>
                    </div>
                    <div class="card-body">
                        <form method="post" action="/passenger/saved-passengers/add">
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label>Name</label>
                                    <input type="text" name="name" class="form-control" required>
                                </div>
                                <div class="col-md-2 mb-3">
                                    <label>Age</label>
                                    <input type="number" name="age" class="form-control" required min="1" max="120">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label>Gender</label>
                                    <select name="gender" class="form-control" required>
                                        <option value="MALE">Male</option>
                                        <option value="FEMALE">Female</option>
                                    </select>
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label>ID Proof</label>
                                    <select name="idProofType" class="form-control">
                                        <option value="">None</option>
                                        <option value="AADHAAR">Aadhaar</option>
                                        <option value="PAN">PAN</option>
                                        <option value="PASSPORT">Passport</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Passenger</button>
                        </form>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5><i class="fas fa-users"></i> My Saved Passengers</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Age</th>
                                        <th>Gender</th>
                                        <th>ID Proof</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${savedPassengers.isEmpty()}">
                                        <td colspan="5" class="text-center">No saved passengers found.</td>
                                    </tr>
                                    <tr th:each="sp : ${savedPassengers}">
                                        <td th:text="${sp.name}"></td>
                                        <td th:text="${sp.age}"></td>
                                        <td th:text="${sp.gender}"></td>
                                        <td th:text="${sp.idProofType != null ? sp.idProofType : '-'}"></td>
                                        <td>
                                            <form method="post" th:action="@{/passenger/saved-passengers/delete/{id}(id=${sp.id})}">
                                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this passenger?')">
                                                    <i class="fas fa-trash"></i> Delete
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
