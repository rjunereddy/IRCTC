# Server Configuration
server.port=9090
server.servlet.context-path=/

# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:file:./data/irctc_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf Configuration
spring.sql.init.mode=never
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging (reduced for demo)
logging.level.com.irctc=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Session Configuration
server.servlet.session.timeout=30m
server.max-http-request-header-size=48KB

# CRITICAL: Disable DevTools auto-restart to prevent H2 database wipe
spring.devtools.restart.enabled=false